name: CI

on:
  push:
  pull_request:

jobs:
  analyze-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
      - run: flutter pub get
      - run: flutter analyze
      - run: flutter test

  # Diff-scoped AI pentest. Off until you opt in: set the repository variable
  # ENABLE_STRIX_SECURITY_SCAN=true and secrets STRIX_LLM (model id, e.g.
  # openai/gpt-5.4) + LLM_API_KEY. See .claude/skills/ci-security-scanning-with-strix.
  security-scan:
    if: ${{ vars.ENABLE_STRIX_SECURITY_SCAN == 'true' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0   # required for diff-scope resolution
      - name: Install Strix
        run: curl -sSL https://strix.ai/install | bash
      - name: Run security scan
        env:
          STRIX_LLM: ${{ secrets.STRIX_LLM }}
          LLM_API_KEY: ${{ secrets.LLM_API_KEY }}
        run: |
          BASE="${{ github.base_ref }}"
          DIFF_BASE="origin/${BASE:-HEAD}"
          git rev-parse --verify --quiet "$DIFF_BASE" >/dev/null || DIFF_BASE="HEAD~1"
          strix -n -t ./ --scan-mode quick --scope-mode diff --diff-base "$DIFF_BASE" --max-budget 10
      - name: Fail unless the scan completed
        if: always()
        run: |
          run_json=$(ls -t strix_runs/*/run.json 2>/dev/null | head -1)
          [ -n "$run_json" ] || { echo "No run.json produced." >&2; exit 1; }
          status=$(jq -r .status "$run_json")
          [ "$status" = "completed" ] || { echo "Scan status '$status' (likely budget exhausted)." >&2; exit 1; }
      - name: Upload SARIF
        if: always()
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: strix_runs
